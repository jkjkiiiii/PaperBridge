name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
  - type: textarea
    id: context
    attributes:
      label: Examples or alternatives
